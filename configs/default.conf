# Sample evaluation config
# listen, root, index, errors, methods, redirect, autoindex, upload, CGI,
# body size, multi-server / multi-port.

server 
	listen			127.0.0.1:8080;
	server_name		localhost;
	client_max_body_size	10M;

	error_page 404 /errors/404.html;
	error_page 405 /errors/405.html;
	error_page 500 /errors/500.html;

	location / {
		root		www;
		index		index.html;
		allowed_methods	GET;
		autoindex	off;
	}

	location /files {
		root		www;
		autoindex	on;
		allowed_methods	GET;
	}

	location /upload {
		root		www;
		allowed_methods	POST GET DELETE;
		upload_store	www/uploads;
		client_max_body_size	2M;
	}

	location /old {
		return	301 /;
	}

	location /cgi-bin {
		root		www;
		allowed_methods	GET POST;
		cgi_extension	.py;
		cgi_pass	/usr/bin/python3;
	}
}

# Second listen — proves multi-port (subject requirement)
server {
	listen			127.0.0.1:8081;
	server_name		localhost;

	location / {
		root		www/site2;
		index		index.html;
		allowed_methods	GET;
	}
}
